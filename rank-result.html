<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>좌석 선택 권 순위 결과</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="rank.js"></script>
</head>
<body class="page-shell page-rank-result">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-grid"></div>

  <main class="app-frame result-frame">
    <header class="result-header glass">
      <div class="result-header-copy">
        <h1>좌석 선택 권 순위 결과</h1>
      </div>
      <div class="result-header-media">
        <a class="hero-visual" href="https://cafe.naver.com/skrtlvkxl" target="_blank" rel="noopener noreferrer" aria-label="네이버 카페로 이동">
          <img src="image/s1.png" alt="">
        </a>
        <small class="result-header-version">v1.22</small>
      </div>
    </header>

    <section class="result-summary-grid">
      <article class="glass stat-card">
        <span>전체 맴버수</span>
        <strong id="totalNameStat">0</strong>
      </article>
      <article class="glass stat-card">
        <span>1위</span>
        <strong id="topNameStat">-</strong>
      </article>
    </section>

    <section class="glass panel result-panel rank-panel">
      <div class="panel-head">
        <h2>순위 목록</h2>
      </div>
      <div id="rankList" class="seat-list rank-list"></div>
    </section>

    <section class="glass result-actions-panel rank-result-actions" aria-label="결과 화면 이동 버튼">
      <a class="ghost-btn link-btn" href="index.html">홈으로</a>
      <a class="ghost-btn link-btn" href="rank-selection.html">다시 하기</a>
    </section>
  </main>
</body>
</html>
